name: Fix History system Back navigation

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix-history-back:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Compose system Back handling to History
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/niyammitra/payfixationcalculator/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          marker = '''    if (showHistory) {\n'''
          insertion = '''    if (showHistory) {\n        // Intercept the Android system Back button while History is displayed so it\n        // returns to the calculator instead of finishing MainActivity. The same\n        // HistoryInterstitialAd flow is used as the visible History back control.\n        androidx.activity.compose.BackHandler {\n            val activity = context as? Activity\n            if (activity != null) {\n                HistoryInterstitialAd.showOnHistoryBack(activity) { showHistory = false }\n            } else {\n                showHistory = false\n            }\n        }\n'''

          if "androidx.activity.compose.BackHandler" in text:
              raise SystemExit("BackHandler already present; no change needed")
          if marker not in text:
              raise SystemExit("History state marker not found")

          path.write_text(text.replace(marker, insertion, 1), encoding="utf-8")

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/niyammitra/payfixationcalculator/MainActivity.kt .github/workflows/fix-history-back.yml
          git commit -m "Fix History system Back navigation"
          git rm .github/workflows/fix-history-back.yml
          git commit -m "Remove temporary navigation fix workflow"
          git push
