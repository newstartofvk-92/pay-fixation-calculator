name: Apply recommendation wording fix

# This one-time workflow changes only the recommendation presentation logic.
# The underlying pay-fixation calculation formulas remain untouched.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch recommendation block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/niyammitra/payfixationcalculator/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          # Replace only the recommendation decision block; all calculation values stay unchanged.
          pattern = r'''(?s)                // If pay differs before the selected DNI, that difference is a real\n                // financial advantage for the period leading up to the DNI\. Otherwise,\n                // compare the pay actually received on the selected DNI itself\.\n                val recommendationText = when \{.*?\n                \}\n                val recommendationColor'''

          replacement = '''                // Explain the trade-off when one option pays more before the selected DNI\n                // while the other pays more from the selected DNI onward. This keeps the\n                // recommendation aligned with the actual cash-pay sequence of both options.\n                val recommendationText = when {\n                    preDniDifference < 0 && dniPayDifference > 0 ->\n                        "Recommended: Option 2. Option 1 gives ₹${-preDniDifference} higher basic pay from the date of promotion until the selected DNI, but Option 2 gives ₹${dniPayDifference} higher basic pay from the selected DNI onward."\n                    preDniDifference > 0 && dniPayDifference < 0 ->\n                        "Recommended: Option 1. Option 2 gives ₹${preDniDifference} higher basic pay from the date of promotion until the selected DNI, but Option 1 gives ₹${-dniPayDifference} higher basic pay from the selected DNI onward."\n                    preDniDifference > 0 ->\n                        "Recommended: Option 1. It gives ₹${preDniDifference} higher basic pay from the date of promotion until the selected DNI, with no lower pay at the selected DNI."\n                    preDniDifference < 0 ->\n                        "Recommended: Option 2. It gives lower basic pay before the selected DNI, but the selected DNI comparison does not show a higher Option 1 pay."\n                    dniPayDifference > 0 ->\n                        "Recommended: Option 2. At the selected DNI, it gives ₹${dniPayDifference} higher basic pay than Option 1."\n                    dniPayDifference < 0 ->\n                        "Recommended: Option 1. At the selected DNI, it gives ₹${-dniPayDifference} higher basic pay than Option 2."\n                    else ->\n                        "Recommended: Both options have the same basic pay at the selected DNI; Option 1 provides fixation from the date of promotion."\n                }\n                val recommendationColor'''

          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Recommendation block not found; refusing to change the file.")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/niyammitra/payfixationcalculator/MainActivity.kt
          git rm .github/workflows/apply-recommendation-fix.yml
          git commit -m "Fix recommendation trade-off wording"
          git push